spack:
  include: [~/.config/nceplibsweeklybuild/tokenpaths.yaml]
  repos:
  - $env/custom_repo
  config:
    build_stage: $env/build_stage
    install_tree:
      root: $env/install
  concretizer:
    unify: true
  view: false
  specs:
  - bacio@develop
  - bufr@develop
  - g2@develop +g2c_compare
  - g2c@develop +build_v2_api
  - g2tmpl@develop
  - ip@develop
#  - ncio@develop
  - nemsio@develop
  - nemsiogfs@develop
  - sigio@develop
  - w3emc@2.11
  - wrf-io@develop
  packages:
    all:
#      require: ^intel-oneapi-compilers-classic@19.1.3.304
      prefer: ["%intel@19"]
    ip:
      prefer: ['+alltests']
    intel-oneapi-compilers-classic:
      externals:
      - spec: intel-oneapi-compilers-classic@19.1.3.304
        prefix: /pe/intel/compilers_and_libraries_2020.4.304/linux
        modules:
        - PrgEnv-intel/8.3.3
        - craype/2.7.17
        - intel/19.1.3.304
        extra_attributes:
          compilers:
            c: /opt/cray/pe/craype/2.7.17/bin/cc
            cxx: /opt/cray/pe/craype/2.7.17/bin/CC
            fortran: /opt/cray/pe/craype/2.7.17/bin/ftn
    mpi:
      buildable: false
      require: cray-mpich
    cray-mpich:
      externals:
      - spec: cray-mpich@8.1.9~wrappers
        prefix: /opt/cray/pe/mpich/8.1.9/ofi/intel/19.0
        modules:
        - libfabric
        - craype-network-ofi
        - cray-mpich/8.1.9
        - cray-pals
    perl:
      buildable: false
      externals:
      - spec: perl@5.26.1~cpanm+opcode+open+shared+threads
        prefix: /usr
    netcdf-c:
      require: '~szip ~blosc ~dap'
    valgrind:
      buildable: false
      externals:
      - spec: valgrind@3.20
        modules: [valgrind4hpc/2.13.2]
